<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPERAÇÃO PCPE // Acesso</title>
<meta name="description" content="Login do painel de missões — Concurso PCPE, cargo Agente de Polícia.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23070a10'/%3E%3Cpath d='M4 18l4-12 4 8 4-8 4 12' stroke='%2300e5ff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

<div class="noise-overlay" aria-hidden="true"></div>
<div class="scan-overlay" aria-hidden="true"></div>

<a class="skip-link" href="#loginCard">Pular para o conteúdo</a>

<main class="login-wrap">
  <div class="login-card panel" id="loginCard">
    <div class="login-head">
      <span class="hud-tag">AGENTE DE POLÍCIA · PCPE 2027</span>
      <h1 class="hud-title">OPERAÇÃO<span>PCPE</span></h1>
      <span class="hud-sub">Acesso ao painel de missões</span>
    </div>

    <div class="login-tabs" role="tablist">
      <button class="login-tab is-active" id="tabLogin" type="button" role="tab" aria-selected="true">Entrar</button>
      <button class="login-tab" id="tabSignup" type="button" role="tab" aria-selected="false">Criar conta</button>
    </div>

    <form id="loginForm" class="login-form" novalidate>
      <label class="login-label" for="loginEmail">E-mail</label>
      <input class="login-input" type="email" id="loginEmail" required autocomplete="email" placeholder="voce@email.com">

      <label class="login-label" for="loginPassword">Senha</label>
      <input class="login-input" type="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••">

      <button type="submit" class="login-submit" id="loginSubmitBtn">Entrar</button>
      <button type="button" class="login-forgot" id="forgotBtn">Esqueci minha senha</button>
    </form>

    <form id="signupForm" class="login-form" novalidate hidden>
      <label class="login-label" for="signupName">Nome (opcional)</label>
      <input class="login-input" type="text" id="signupName" autocomplete="name" placeholder="Como te chamar no HUD">

      <label class="login-label" for="signupEmail">E-mail</label>
      <input class="login-input" type="email" id="signupEmail" required autocomplete="email" placeholder="voce@email.com">

      <label class="login-label" for="signupPassword">Senha (mín. 6 caracteres)</label>
      <input class="login-input" type="password" id="signupPassword" required autocomplete="new-password" minlength="6" placeholder="••••••••">

      <label class="login-label" for="signupPassword2">Confirmar senha</label>
      <input class="login-input" type="password" id="signupPassword2" required autocomplete="new-password" minlength="6" placeholder="••••••••">

      <button type="submit" class="login-submit" id="signupSubmitBtn">Criar conta</button>
    </form>

    <div class="login-divider"><span>ou</span></div>

    <button class="login-google" id="googleBtn" type="button">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.7l5.7-5.7C33.6 6.5 29 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/>
        <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c2.8 0 5.3 1 7.3 2.7l5.7-5.7C33.6 6.5 29 4.5 24 4.5c-7.7 0-14.4 4.3-17.7 10.2z"/>
        <path fill="#4CAF50" d="M24 43.5c5.1 0 9.6-1.9 13-5l-6-5.1C29 35.4 26.6 36.2 24 36.2c-5.3 0-9.7-3.6-11.3-8.4l-6.6 5.1C9.6 39.1 16.2 43.5 24 43.5z"/>
        <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.3-4.3 5.7l6 5.1c-.4.4 6.4-4.7 6.4-14.3 0-1.2-.1-2.4-.4-3.5z"/>
      </svg>
      Continuar com Google
    </button>

    <p class="login-msg" id="loginMsg" role="alert" aria-live="polite"></p>
  </div>
</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
